<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
</head>
<body>
<h1 th:text="${book.id != null} ? 'Edit Book' : 'Add Book'"></h1>
<form th:action="@{${book.id != null} ? '/books/edit/' + ${book.id} : '/books/add'}" 
      th:object="${book}" method="post">
    <p>Title: <input type="text" th:field="*{title}"/></p>
    <p>Author: <input type="text" th:field="*{author}"/></p>
    <p>Price: <input type="number" step="0.01" th:field="*{price}"/></p>
    <p><button type="submit">Save</button></p>
</form>
<a href="/books">Back to list</a>
</body>
</html>
